name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  check-test:
    name: Check and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Show tool versions
        run: |
          node --version
          npm --version

      - name: Syntax check
        run: npm run check

      - name: Test
        run: npm test
